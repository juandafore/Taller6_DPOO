<text x="20" y="1003" font-size="12" fill="#444">Leyenda: línea continua + triángulo = herencia (extends) · línea punteada + triángulo = implementa interfaz · flecha abierta = asociación navegable (doble flecha = bidireccional) · punteada + flecha abierta = dependencia</text>
<text x="20" y="1021" font-size="12" fill="#444">JFrame, JPanel (javax.swing); ActionListener, MouseListener (java.awt.event); ListSelectionListener (javax.swing.event). Los atributos de tipo Swing (JButton, JLabel, JList…) se muestran como atributos de cada clase.</text>
